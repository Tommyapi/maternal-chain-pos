<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#e5484d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="门店助手">
<title>萌贝 · 门店助手</title>
<link rel="manifest" href="static/manifest.webmanifest">
<link rel="icon" href="static/favicon.png">
<link rel="apple-touch-icon" href="static/favicon.png">
<style>
:root{--pri:#e5484d;--pri2:#fff1f1;--ink:#1f2633;--ink2:#4b5565;--mut:#8a94a6;--line:#eceff4;--bg:#f4f6f9;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--card:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);font-size:15px;line-height:1.45;padding-bottom:calc(68px + env(safe-area-inset-bottom))}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
em{font-style:normal}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,#e5484d,#ff7a6e);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 12px}
header .t{display:flex;align-items:center;gap:10px;min-height:32px}
header h1{font-size:18px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .back{font-size:22px;width:32px;height:32px;margin-left:-6px}
header .sub{font-size:12px;opacity:.92;margin-top:2px}
header select,header input{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:10px;padding:6px 10px;font-size:14px;max-width:60vw}
header select option{color:#000}
.hbar{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:rgba(255,255,255,.2);border-radius:10px;padding:2px}
.seg button{padding:5px 12px;border-radius:8px;font-size:14px}
.seg button.on{background:#fff;color:var(--pri);font-weight:600}
.wrap{padding:12px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.card h3{font-size:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 small{font-weight:400;color:var(--mut);font-size:12px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:#fff;border-radius:14px;padding:12px}
.kpi.main{grid-column:1/3;background:linear-gradient(135deg,#fff,#fff5f5)}
.kpi span{font-size:12px;color:var(--mut)}
.kpi b{display:block;font-size:22px;margin:4px 0 2px}
.kpi.main b{font-size:32px;color:var(--pri)}
.kpi em{font-style:normal;font-size:12px;color:var(--mut);display:block}
.up{color:var(--bad)!important}.down{color:var(--ok)!important}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.bars div{flex:1;background:#fde2e2;border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.on{background:var(--pri)}
.hx{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);margin-top:4px}
.list .it{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);gap:10px}
.list .it:last-child{border-bottom:0}
.list .l{min-width:0;flex:1}
.list .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .s{font-size:12px;color:var(--mut);margin-top:2px}
.list .r{text-align:right;white-space:nowrap}
.list .r b{font-size:15px}
.list .it.unread .n::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--pri);margin-right:6px;vertical-align:middle}
.rank{display:inline-flex;width:22px;height:22px;border-radius:6px;background:#f1f3f7;align-items:center;justify-content:center;font-size:12px;margin-right:8px;color:var(--ink2);flex:none}
.rank.t{background:var(--pri);color:#fff}
.pbar{height:6px;background:#f1f3f7;border-radius:3px;margin-top:5px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--pri);border-radius:3px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{background:#fff;border-radius:14px;padding:12px 4px;text-align:center;position:relative;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px}
.tile i{font-style:normal;font-size:24px;width:42px;height:42px;border-radius:12px;background:var(--pri2);display:flex;align-items:center;justify-content:center}
.badge{position:absolute;top:6px;right:10px;background:var(--pri);color:#fff;border-radius:10px;font-size:11px;min-width:18px;height:18px;line-height:18px;padding:0 5px;text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:#f7f8fa;border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--mut)}
.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--ink2);margin-bottom:5px}
.inp{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;outline:none}
textarea.inp{height:90px;padding:10px 12px;resize:vertical}
.inp:focus{border-color:var(--pri)}
.btn{height:46px;padding:0 18px;border-radius:12px;background:var(--pri);color:#fff;font-weight:600;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.block{width:100%}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.gray{background:#eef0f4;color:var(--ink)}
.btn.ok{background:var(--ok)}
.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:10px;margin-top:12px}
.btns .btn{flex:1}
.search{display:flex;gap:8px;margin-bottom:12px}
.search .inp{flex:1}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:6px;background:#fff4e5;color:#b45309;margin-left:4px;vertical-align:middle}
.tag.red{background:#fee2e2;color:#b91c1c}.tag.green{background:#dcfce7;color:#166534}.tag.gray{background:#f1f3f7;color:var(--ink2)}.tag.blue{background:#e0ecff;color:#1d4ed8}
.tabs{display:flex;background:#fff;border-radius:12px;padding:3px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;height:38px;border-radius:10px;font-size:14px;white-space:nowrap;padding:0 10px}
.tabs button.on{background:var(--pri);color:#fff;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}
.note{font-size:12px;color:var(--mut);line-height:1.6}
.warnbox{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:12px;font-size:14px;margin-bottom:12px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--mut)}
.kv dd{word-break:break-all}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;height:58px;font-size:11px;color:var(--mut);position:relative}
nav.tabbar a i{font-style:normal;font-size:22px;line-height:1}
nav.tabbar a.on{color:var(--pri);font-weight:600}
nav.tabbar .badge{top:4px;right:calc(50% - 22px)}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:rgba(17,24,39,.88);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:100;max-width:80vw;text-align:center;pointer-events:none;transition:opacity .2s;opacity:0}
#toast.on{opacity:1}
.sheet-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h4{font-size:17px;margin-bottom:12px}
.banner{background:#1f2633;color:#fff;padding:10px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.banner button{background:#fff;color:#1f2633;border-radius:8px;padding:4px 10px;font-size:13px}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px}
.login h2{font-size:24px;margin-bottom:6px}
.login p{color:var(--mut);margin-bottom:24px}
.scan{position:fixed;inset:0;background:#000;z-index:90;display:flex;flex-direction:column}
.scan video{flex:1;width:100%;object-fit:cover;min-height:0}
.scan .frame{position:absolute;left:12%;right:12%;top:30%;height:22%;border:2px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
.scan .bar{padding:12px 14px calc(14px + env(safe-area-inset-bottom));background:#111;display:flex;gap:8px;align-items:center}
.scan .bar .inp{flex:1;background:#222;border-color:#333;color:#fff}
.scan .tip{position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top));text-align:center;color:#fff;font-size:14px;text-shadow:0 1px 2px #000;padding:0 20px}
.qtybox{display:flex;align-items:center;gap:8px}
.qtybox button{width:44px;height:44px;border-radius:12px;background:#eef0f4;font-size:22px}
.qtybox .inp{text-align:center;width:90px;flex:none}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.lg{font-size:20px;font-weight:700}
.pad{height:8px}
</style>
</head>
<body>
<div id="banner"></div>
<div id="app"><div class="empty" style="padding-top:40vh">加载中…</div></div>
<nav class="tabbar hidden" id="tabbar"></nav>
<div id="toast"></div>
<script src="static/m-scan.js"></script>
<script src="static/m-app.js"></script>
</body>
</html>
